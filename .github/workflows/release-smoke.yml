name: CipherChat Release Smoke

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  api-container-smoke:
    name: API container release smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cipherchat
          POSTGRES_PASSWORD: cipherchat
          POSTGRES_USER: cipherchat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cipherchat -d cipherchat"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      API_BASE_URL: http://127.0.0.1:4000
      API_HOST: 0.0.0.0
      API_PORT: 4000
      CORS_ORIGIN: https://app.cipherchat.example
      DATABASE_URL: postgresql://cipherchat:cipherchat@127.0.0.1:5432/cipherchat
      DEVICE_SIGNATURE_VERIFIER: ed25519
      INTERNAL_JOB_TOKEN: CipherChat.ReleaseSmoke.Token.2026!RotateMe
      NODE_ENV: production
      REDIS_URL: redis://127.0.0.1:6379

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply database migrations
        run: npm run prisma:migrate:deploy

      - name: Build API container
        run: docker build -f apps/api/Dockerfile -t cipherchat-api:smoke .

      - name: Run API container
        run: >-
          docker run
          --detach
          --name cipherchat-api
          --network host
          --env API_HOST
          --env API_PORT
          --env CORS_ORIGIN
          --env DATABASE_URL
          --env DEVICE_SIGNATURE_VERIFIER
          --env INTERNAL_JOB_TOKEN
          --env NODE_ENV
          --env REDIS_URL
          cipherchat-api:smoke

      - name: Run release smoke checks
        run: npm run release:smoke

      - name: Dump API logs on failure
        if: failure()
        run: docker logs cipherchat-api || true
